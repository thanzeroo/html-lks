    <h1>Belajar</h1>

    <!-- paragraph -->

    <!-- bold untuk b -->
    <!-- italic untuk i -->
    <!-- underline untuk u -->
    <p>
        dan saya suka dengan <b>minuman</b> dan minuman faforit saya adalah cocacola
    </p>
    <p>
        saya <u>sulthan</u> suka makan <i>makanan</i> dan makanan faforti saya adalah dada ayam filet
    </p>

    <!-- superscript dan subscript -->
    <!-- sup untuk kuadrat di atas -->
    <!-- sub untuk bentuk kuadrat tapi di bawah -->
    <p>
        saya adalah orang hebat jago koding <sup>2</sup>
    </p>

    <p>
        dan saya sangat penasaran dengan sum <sub>3</sub>
    </p>
